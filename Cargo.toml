[package]
name = "oauth_mocker"
version = "0.2.0"
edition = "2024"

[dependencies]
askama = "0.16"
axum = "0.8"
base64 = "0.23"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
percent-encoding = "2"
rsa = "0.9.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
url = "2.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
uuid = { version = "1.1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true