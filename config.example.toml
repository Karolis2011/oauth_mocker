# A confidential client.
[[clients]]
client_id = "my-client"
client_secret = "my-secret"
name = "My App"
# redirect_uris = ["http://localhost:3000/callback"]   # exact match, any URI is accepted when omitted
# strict_redirect_uri = true                           # per-client override of the global option
# scopes = ["openid", "profile", "email", "groups"]   # restrict requestable scopes
# access_ttl = 600                                     # per-client id_ttl / access_ttl / refresh_ttl

# Failure injection, for testing how an app copes with a misbehaving provider.
# [clients.simulate]
# token_error = "invalid_grant"
# refresh_error = "server_error"    # refresh_token grants only
# token_delay_ms = 1500
# userinfo_error = "invalid_token"

# A public client (no secret), PKCE is mandatory.
[[clients]]
client_id = "my-spa"
name = "My Single Page App"

# Users, with any extra claims as JSON-compatible values.
[[users]]
id = "1"
name = "Alice"
email = "alice@example.com"
[users.claims]
email_verified = true
groups = ["admin", "user"]

[[users]]
id = "2"
name = "Bob"
email = "bob@example.com"
[users.claims]
email_verified = false
groups = ["user"]
