# OAuth Mocker example configuration. Copy to config.toml (or point OAUTH_MOCKER_CONFIG at it).
# Every option is shown with its default unless noted. See docs/DESIGN.md for the details.

# Use https:// in discovery and token URLs when the mock sits behind a TLS proxy.
use_tls = false
# Fixed issuer URL. When unset it is derived from the Host header of each request.
# issuer = "http://localhost:8080"
# Scope used when an authorization request does not ask for any.
default_scope = "openid profile email"
# Make the token endpoint require a redirect_uri identical to the authorize request (RFC 6749 4.1.3).
# Off by default. Turn it on to catch clients that a real provider would reject. Clients can override it.
strict_redirect_uri = false
# What to do with a login_hint (matches a user's id, name or email, ignoring case):
#   "highlight"  list the matching account first, marked as suggested
#   "auto"       skip the account picker when exactly one account matches
#   "ignore"     do not look at the hint
login_hint = "highlight"

[tokens]
code_ttl = 60          # authorization code lifetime, seconds
access_ttl = 3600      # access token lifetime, seconds
id_ttl = 3600          # ID token lifetime, seconds
refresh_ttl = 86400    # refresh token lifetime, seconds, 0 disables refresh tokens
rotate_refresh = true  # issue a new refresh token on every refresh

[ui]
title = "Mock Login"
# CSS appended after the built-in stylesheet. Overriding the variables is usually enough.
custom_css = """
:root { --accent: #5b5bd6; }
"""
# custom_css_file = "theme.css"

# Custom scopes, and overrides of the built-in ones (profile -> name, email -> email + email_verified).
# A claim named by some scope is released only when that scope is granted, other claims are always released.
[scopes.groups]
claims = ["groups"]

[[keys]]
# Determines if the key is used for signing JWT tokens
active = true
# Key type, only "PEM_RS256" is supported for now
kind = "PEM_RS256"
# This is key ID is used to identify the key in the JWT token
