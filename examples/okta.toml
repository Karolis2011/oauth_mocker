# Emulates an Okta custom authorization server named `default`. Run with OAUTH_MOCKER_CONFIG=examples/okta.toml.
# Point your app at http://localhost:8000/oauth2/default/.well-known/openid-configuration.
# See presets/okta.toml for what the preset changes, everything here can override it.
preset = "okta"

